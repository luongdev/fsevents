# FreeSWITCH ESL Sidecar App Configuration

# FreeSWITCH ESL Connection
esl:
  host: "localhost"
  port: 8021
  password: "ClueCon"
  timeout: 10s
  reconnect_interval: 5s
  max_reconnect_attempts: 10

# Event filtering
events:
  subscribe_events:
    - CHANNEL_CREATE
    - CHANNEL_DESTROY
    - CHANNEL_ANSWER
    - CHANNEL_HANGUP
    # CUSTOM events - flexible naming (with or without namespace)
    - "CUSTOM callcenter::info"
    - "CUSTOM sofia::register"
    - "CUSTOM my-custom-event"
    - "CUSTOM app_notification"
    - "CUSTOM conference maintenance"
  filters:
    - field: "Event-Name"
      operator: "equals"
      value: "CHANNEL_CREATE"
    - field: "Caller-Destination-Number"
      operator: "regex"
      value: "^84[0-9]{9}$"
    # Filter for CUSTOM events
    - field: "Event-Subclass"
      operator: "equals"
      value: "callcenter::info"

# HTTP destinations
http:
  destinations:
    - name: "webhook1"
      url: "https://api.example.com/webhook"
      method: "POST"
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer token"
      timeout: 30s
      retry:
        max_attempts: 3
        backoff: "exponential"
        initial_delay: 1s
        max_delay: 30s

# Logging configuration
# level: debug, info, warn, error, fatal, panic
# format: json, console
# output: stdout, stderr, or file path
logging:
  level: "info"
  format: "json"
  output: "stdout"

# Alternative logging examples:
# For development with colored console output:
# logging:
#   level: "debug"
#   format: "console"
#   output: "stdout"

# For production with file output:
# logging:
#   level: "info"
#   format: "json"
#   output: "/var/log/fsevents/app.log"

# Metrics
metrics:
  enabled: true
  port: 9090
  path: "/metrics" 