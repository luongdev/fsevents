# FreeSWITCH ESL Sidecar Configuration Example

# ESL connection configuration
esl:
  host: "192.168.13.137"
  port: 8021
  password: "ClueCon"
  timeout: 10s
  reconnect_interval: 5s
  max_reconnect_attempts: 3

# Event subscription and processing configuration
events:
  # Subscribe to specific events
  subscribe_events:
    - "HEARTBEAT"
    - "CHANNEL_CREATE"
    - "CUSTOM callcenter::info"

  # Event filters - chỉ xử lý events thỏa mãn điều kiện
  # filters:
  #   - field: "Event-Name"
  #     operator: "not_equals"
  #     value: "RE_SCHEDULE"

  # Global field mappings - áp dụng cho tất cả events
  field_mappings:
    - from: "Event-Name"
      to: "event_type"
      transforms: ["lowercase"]
    
    - from: "Event-Date-Local"
      to: "event_time"
      transforms: ["trim"]
    
    - from: "FreeSWITCH-Hostname"
      to: "server_name"
      transforms: ["lowercase", "trim"]
      default_value: "unknown"

  # Event-specific field mappings - chỉ áp dụng cho events cụ thể
  event_field_mappings:
    # HEARTBEAT events - System monitoring
    - event_types: ["HEARTBEAT"]
      mappings:
        - from: "Session-Count"
          to: "active_sessions"
          transforms: [":int"]
          default_value: "0"
        
        - from: "Idle-Cpu"
          to: "cpu_idle_percent"
          transforms: [":float"]
          default_value: "0.0"
        
        - from: "FreeSWITCH-Uptime-msec"
          to: "uptime_ms"
          transforms: [":int"]
        
        - from: "Up-Time"
          to: "uptime_readable"
          transforms: ["trim", "url_decode"]
        
        - from: "Session-Since-Startup"
          to: "total_sessions"
          transforms: [":int"]
          default_value: "0"

    # CHANNEL events - Call information
    - event_types: ["CHANNEL_*"]
      mappings:
        - from: "Unique-ID"
          to: "call_id"
          transforms: ["trim"]
        
        - from: "Caller-Caller-ID-Number"
          to: "caller_number"
          transforms: ["trim", "s/[^0-9]//g"]  # Remove non-digits
          default_value: "unknown"
        
        - from: "Caller-Destination-Number"
          to: "destination_number"
          transforms: ["trim", "s/[^0-9]//g"]  # Remove non-digits
          default_value: "unknown"
        
        - from: "Call-Direction"
          to: "direction"
          transforms: ["lowercase", "trim"]
        
        - from: "Channel-State"
          to: "state"
          transforms: ["lowercase", "trim"]
        
        - from: "Caller-Caller-ID-Name"
          to: "caller_name"
          transforms: ["trim", "url_decode"]
          default_value: "anonymous"
        
        - from: "variable_sip_user_agent"
          to: "user_agent"
          transforms: ["url_decode", "trim"]
          default_value: "unknown"
        
        # Multiple transforms example - extract domain from caller number
        - from: "Caller-Caller-ID-Number"
          to: "caller_domain"
          transforms: ["trim", "s/.*@//", "lowercase"]  # Extract domain part
          default_value: "internal"

    # CUSTOM callcenter events - Agent activity
    - event_types: ["CUSTOM callcenter::*"]
      mappings:
        - from: "CC-Action"
          to: "action"
          transforms: ["lowercase", "trim"]
        
        - from: "CC-Agent"
          to: "agent_id"
          transforms: ["uppercase", "trim"]
        
        - from: "CC-Queue"
          to: "queue_name"
          transforms: ["lowercase", "trim"]
        
        - from: "CC-Agent-State"
          to: "agent_state"
          transforms: ["uppercase", "trim"]
        
        - from: "CC-Agent-Login-Time"
          to: "login_timestamp"
          transforms: [":int"]
        
        # Transform agent name with multiple operations
        - from: "CC-Agent-Name"
          to: "agent_display_name"
          transforms: ["trim", "url_decode", "first_word", "uppercase"]
          default_value: "UNKNOWN"

    # CHANNEL_CREATE specific mappings
    - event_types: ["CHANNEL_CREATE"]
      mappings:
        - from: "Channel-Creation-Time"
          to: "created_at"
          transforms: [":int"]
        
        - from: "variable_sip_call_id"
          to: "sip_call_id"
          transforms: ["trim"]

    # CHANNEL_HANGUP specific mappings  
    - event_types: ["CHANNEL_HANGUP"]
      mappings:
        - from: "Hangup-Cause"
          to: "hangup_reason"
          transforms: ["lowercase", "trim"]
        
        - from: "variable_billsec"
          to: "call_duration_seconds"
          transforms: [":int"]
          default_value: "0"
        
        - from: "variable_duration"
          to: "total_duration_seconds"
          transforms: [":int"]
          default_value: "0"

# HTTP destinations với selective routing
http:
  destinations:
    # System monitoring endpoint - chỉ nhận HEARTBEAT events
    - name: "system-monitor"
      url: "https://httpbin.org/post"
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-Source: "fsevents-system"
        X-System-ID: "freeswitch-01"
      timeout: 30s
      retry:
        max_attempts: 3
        backoff: "exponential"
        initial_delay: 1s
        max_delay: 30s
      event_filters: ["HEARTBEAT"]

    # Call tracking endpoint - chỉ nhận CHANNEL events
    - name: "call-tracker"
      url: "https://httpbin.org/post"
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-Source: "fsevents-calls"
        X-System-ID: "freeswitch-01"
      timeout: 30s
      retry:
        max_attempts: 3
        backoff: "exponential"
        initial_delay: 1s
        max_delay: 30s
      event_filters: ["CHANNEL_*"]

    # Callcenter analytics - chỉ nhận CUSTOM callcenter events
    - name: "callcenter-analytics"
      url: "https://httpbin.org/post"
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-Source: "fsevents-callcenter"
        X-System-ID: "freeswitch-01"
      timeout: 30s
      retry:
        max_attempts: 3
        backoff: "exponential"
        initial_delay: 1s
        max_delay: 30s
      event_filters: ["CUSTOM callcenter::*"]

    # Audit logger - nhận tất cả events
    - name: "audit-logger"
      url: "https://httpbin.org/post"
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-Source: "fsevents-audit"
        X-System-ID: "freeswitch-01"
      timeout: 30s
      retry:
        max_attempts: 2
        backoff: "linear"
        initial_delay: 2s
        max_delay: 10s
      event_filters: ["*"]

# Logging configuration
logging:
  level: "info"
  format: "json"
  output: "console"

# Metrics configuration
metrics:
  enabled: false
  port: 8080
  path: "/metrics" 