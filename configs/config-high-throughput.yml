# High-Throughput Configuration Example
# This configuration is optimized for handling high event rates from FreeSWITCH

esl:
  host: localhost
  port: 8021
  password: ClueCon
  timeout: 10s
  reconnect_interval: 5s
  max_reconnect_attempts: 10
  keepalive:
    enabled: true
    interval: 15s
    timeout: 3s
    failure_threshold: 2

# Processing configuration for concurrent event handling
processing:
  # Number of worker goroutines for concurrent processing
  # 0 = auto-detect CPU count (recommended)
  # Set higher for CPU-bound workloads, lower for memory-constrained environments
  worker_count: 0  # Auto-detect (typically 4-16 on modern systems)
  
  # Event buffer size for ESL client channel
  # Larger buffer = can handle bigger bursts but uses more memory
  # ~2KB per event, so 10000 events ≈ 20MB
  event_buffer_size: 10000

events:
  # Subscribe to all channel events for high-volume scenarios
  subscribe_events:
    - CHANNEL_CREATE
    - CHANNEL_ANSWER
    - CHANNEL_HANGUP
    - CHANNEL_BRIDGE
    - CHANNEL_UNBRIDGE
    - CHANNEL_PROGRESS
    - CHANNEL_EXECUTE
    - CHANNEL_EXECUTE_COMPLETE
    - HEARTBEAT

  # Optional: Filter events to reduce processing load
  # Uncomment to enable filtering
  # filter_logic: AND
  # filters:
  #   - field: Event-Name
  #     operator: equals
  #     value: CHANNEL_HANGUP

  # Field mappings to extract relevant data
  field_mappings:
    - from: Unique-ID
      to: call_id
    - from: Event-Name
      to: event_type
    - from: Caller-Caller-ID-Number
      to: caller_number
    - from: Caller-Destination-Number
      to: destination_number
    - from: Event-Date-Timestamp
      to: timestamp
      transforms:
        - :divide:1000  # Convert microseconds to milliseconds

http:
  destinations:
    - name: webhook-endpoint
      url: http://localhost:3000/events
      method: POST
      timeout: 5s  # Keep timeout short to avoid blocking workers
      
      # Retry configuration for failed requests
      retry:
        max_attempts: 3
        backoff: exponential
        initial_delay: 100ms
        max_delay: 2s
      
      # Optional: Filter which events go to this destination
      # event_filters:
      #   - CHANNEL_HANGUP
      #   - CHANNEL_ANSWER
      
      headers:
        Content-Type: application/json
        X-Source: freeswitch-esl

logging:
  level: info  # Use 'debug' for troubleshooting, 'info' for production
  format: json
  output: stdout

metrics:
  enabled: true
  port: 9090
  path: /metrics

# Performance Tuning Notes:
# 
# 1. Worker Count:
#    - Start with 0 (auto-detect) and monitor CPU usage
#    - Increase if CPU usage is low but events are backing up
#    - Decrease if CPU usage is maxed out
#
# 2. Event Buffer Size:
#    - 10000 is good for most scenarios (handles ~5-10 second bursts at 1000 events/sec)
#    - Increase to 50000+ for very high burst rates
#    - Monitor "queue_usage_percent" in metrics
#
# 3. HTTP Timeout:
#    - Keep short (5s or less) to avoid blocking workers
#    - Use retry configuration for reliability
#    - Consider async webhooks if endpoints are slow
#
# 4. Memory Usage:
#    - Each event ≈ 2KB in memory
#    - event_buffer_size=10000 ≈ 20MB
#    - worker_count=8 with active events ≈ 16KB
#    - Total overhead ≈ 20-30MB
#
# 5. Expected Performance:
#    - With 8 workers: 5000-10000 events/second
#    - Latency: 5-50ms per event (p95)
#    - This is 25-50x faster than sequential processing
