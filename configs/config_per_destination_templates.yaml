# FreeSWITCH ESL Sidecar App Configuration
# Demonstrating per-destination payload templates

# FreeSWITCH ESL Connection
esl:
  host: "192.168.13.137"
  port: 8021
  password: "ClueCon"
  timeout: 10s
  reconnect_interval: 5s
  max_reconnect_attempts: 10

# Event filtering and processing
events:
  filter_logic: "AND"
  
  filters:
    - field: "CC-Action"
      operator: "regex"
      value: "^(agent-)(status|state)(-change)$"

  subscribe_events:
    - "CUSTOM callcenter::info"
    - "CHANNEL_CREATE"
    - "CHANNEL_HANGUP"
    - "HEARTBEAT"

  field_mappings:
    - from: "Event-Date-Timestamp"
      to: "timestamp"
      transforms: [":int", ":divide:1000", ":round"]

  event_field_mappings:
    - event_types: ["CUSTOM callcenter::*"]
      mappings:
        - from: "CC-Action"
          to: "action"
          transforms: ["trim"]
        
        - from: "CC-Agent"
          to: "agent_id"
          transforms: ["trim"]
        
        - from: "CC-Queue"
          to: "queue_name"
          transforms: ["trim"]
        
        - from: "CC-Agent-State"
          to: "agent_state"
          transforms: ["url_decode"]
        
        - from: "CC-Agent-Status"
          to: "agent_status"
          transforms: ["url_decode"]

      field_filters:
        include_fields:
          - "timestamp" 
          - "action"
          - "agent_id"
          - "queue_name"
          - "agent_state"
          - "agent_status"
        exclude_fields:
          - "headers"
          - "event_subclass"
          - "event_name"
        include_body: false

    - event_types: ["CHANNEL_*"]
      mappings:
        - from: "Unique-ID"
          to: "call_id"
          transforms: ["trim"]
        
        - from: "Caller-Caller-ID-Number"
          to: "caller_number"
          transforms: ["trim"]
        
        - from: "Caller-Destination-Number"
          to: "destination_number"
          transforms: ["trim"]
        
        - from: "Channel-State"
          to: "channel_state"
          transforms: ["trim"]

      field_filters:
        include_fields:
          - "timestamp"
          - "event_name"
          - "call_id"
          - "caller_number"
          - "destination_number"
          - "channel_state"
        include_body: false

# HTTP destinations với per-destination payload templates
http:
  destinations:
    # Analytics endpoint - JSON format với custom structure
    - name: "analytics-api"
      url: "https://httpbin.org/post"
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-Source: "fsevents-analytics"
      timeout: 30s
      retry:
        max_attempts: 3
        backoff: "exponential"
        initial_delay: 1s
        max_delay: 30s
      event_filters:
        - "CUSTOM callcenter::*"
      
      # Custom JSON template for analytics
      payload_template:
        format: "json"
        headers:
          X-Event-Source: "freeswitch-esl"
          X-Analytics-Version: "v1.0"

    # Call tracking endpoint - Simplified JSON format
    - name: "call-tracker"
      url: "https://httpbin.org/post"
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-Source: "fsevents-calls"
      timeout: 15s
      retry:
        max_attempts: 2
        backoff: "fixed"
        initial_delay: 2s
        max_delay: 5s
      event_filters:
        - "CHANNEL_*"
      
      # Simple JSON format for call tracking
      payload_template:
        format: "json"
        headers:
          X-Call-Tracking: "enabled"
          X-System-ID: "fs-01"

    # Webhook endpoint - XML format
    - name: "xml-webhook"
      url: "https://httpbin.org/post"
      method: "POST"
      headers:
        Content-Type: "application/xml"
        X-Source: "fsevents-xml"
      timeout: 20s
      retry:
        max_attempts: 2
        backoff: "linear"
        initial_delay: 1s
        max_delay: 10s
      event_filters:
        - "HEARTBEAT"
      
      # XML format template
      payload_template:
        format: "xml"
        headers:
          X-Format: "xml"
          X-Schema-Version: "1.0"

    # Form data endpoint - Form format
    - name: "form-endpoint"
      url: "https://httpbin.org/post"
      method: "POST"
      headers:
        Content-Type: "application/x-www-form-urlencoded"
        X-Source: "fsevents-form"
      timeout: 10s
      retry:
        max_attempts: 1
        backoff: "fixed"
        initial_delay: 1s
        max_delay: 5s
      event_filters:
        - "CUSTOM callcenter::info"
      
      # Form data template
      payload_template:
        format: "form"
        headers:
          X-Encoding: "form-urlencoded"

    # Default endpoint - No template (uses default JSON)
    - name: "default-json"
      url: "https://httpbin.org/post"
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-Source: "fsevents-default"
      timeout: 30s
      retry:
        max_attempts: 2
        backoff: "fixed"
        initial_delay: 2s
        max_delay: 5s
      event_filters:
        - "*"
      
      # No payload_template specified - uses default JSON format

# Logging
logging:
  level: "debug"
  format: "console"
  output: "stdout"

# Metrics
metrics:
  enabled: false
  port: 8080
  path: "/metrics" 