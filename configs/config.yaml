# FreeSWITCH ESL Sidecar App Configuration

# FreeSWITCH ESL Connection
esl:
  host: "192.168.13.137"
  port: 8021
  password: "ClueCon"
  timeout: 10s
  reconnect_interval: 5s
  max_reconnect_attempts: 10

# Event filtering
events:
  subscribe_events:
    - "HEARTBEAT"
    - "CUSTOM callcenter::info"
  filters:
    - field: "Event-Name"
      operator: "equals"
      value: "CHANNEL_CREATE"

# HTTP destinations
http:
  destinations:
    - name: "webhook-test"
      url: "https://httpbin.org/post"
      method: "POST"
      headers:
        Content-Type: "application/json"
        X-Source: "fsevents"
      timeout: 30s
      retry:
        max_attempts: 3
        backoff: "exponential"
        initial_delay: 1s
        max_delay: 30s

# Logging
logging:
  level: "info"
  format: "console"
  output: "stdout"

# Metrics
metrics:
  enabled: true
  port: 9090
  path: "/metrics" 