# FreeSWITCH ESL Sidecar App Configuration

# FreeSWITCH ESL Connection
esl:
  host: "192.168.13.137"
  port: 8021
  password: "ClueCon"
  timeout: 10s
  reconnect_interval: 5s
  max_reconnect_attempts: 10

# Event filtering and processing
events:
  subscribe_events:
    - "HEARTBEAT"
    - "CUSTOM callcenter::info"

  event_field_mappings:
    - event_types: ["CUSTOM callcenter::*"]
      mappings:
        - from: "Cc-Action"
          to: "action"
          transforms: ["trim"]
        
        - from: "Cc-Agent"
          to: "agent_id"
          transforms: ["trim"]
        
        - from: "Cc-Queue"
          to: "queue_name"
          transforms: ["trim"]
        
        - from: "Cc-Agent-State"
          to: "agent_state"
          transforms: ["url_decode"]
        
        - from: "Cc-Agent-Status"
          to: "agent_status"
          transforms: ["url_decode"]
      

# HTTP destinations với selective routing
http:
  destinations:
    - name: "asm"
      url: "https://httpbin.org/post"
      method: "POST"
      headers:
        Content-Type: "application/json"
      timeout: 5s
      retry:
        max_attempts: 2
        backoff: "fixed"
        initial_delay: 2s
        max_delay: 5s
      event_filters:
        - "CUSTOM callcenter::*"

# Logging
logging:
  level: "debug"
  format: "console"
  output: "stdout"

# Metrics
metrics:
  enabled: true
  port: 9090
  path: "/metrics" 