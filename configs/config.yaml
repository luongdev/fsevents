# FreeSWITCH ESL Sidecar App Configuration

# FreeSWITCH ESL Connection
esl:
  host: "192.168.13.137"
  port: 8021
  password: "ClueCon"
  timeout: 10s
  reconnect_interval: 5s
  max_reconnect_attempts: 10

# Event filtering and processing
events:
  subscribe_events:
    - "HEARTBEAT"
    - "CUSTOM callcenter::info"

  # Custom processors để modify payload
  processors:
    - name: "callcenter_processor"
      type: "builtin"
      event_types: ["CUSTOM callcenter::info"]
      config:
        rules:
          - action: "add_field"
            field: "event_category"
            value: "custom"
          - action: "add_field"
            field: "subclass_info"
            value: "${header:Event-Subclass}"
          - action: "conditional"
            condition:
              field: "Event-Subclass"
              operator: "contains"
              value: "callcenter"
            then:
              - action: "add_field"
                field: "system"
                value: "callcenter"
              - action: "add_field"
                field: "priority"
                value: "high"

# HTTP destinations với selective routing
http:
  destinations:
    - name: "asm"
      url: "https://httpbin.org/post"
      method: "POST"
      headers:
        Content-Type: "application/json"
      timeout: 5s
      retry:
        max_attempts: 2
        backoff: "fixed"
        initial_delay: 2s
        max_delay: 5s
      event_filters:
        - "CUSTOM callcenter::info"

# Logging
logging:
  level: "debug"
  format: "console"
  output: "stdout"

# Metrics
metrics:
  enabled: true
  port: 9090
  path: "/metrics" 