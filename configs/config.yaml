# FreeSWITCH ESL Sidecar App Configuration

# FreeSWITCH ESL Connection
esl:
  host: "192.168.13.137"
  port: 8021
  password: "ClueCon"
  timeout: 10s
  reconnect_interval: 5s
  max_reconnect_attempts: 10

# Event filtering and processing
events:
  subscribe_events:
    - "CUSTOM callcenter::info"

  field_mappings:
    - from: "Event-Date-Timestamp"
      to: "timestamp"
      transforms: [":int", ":divide:1000", ":round"]

  event_field_mappings:
    - event_types: ["CUSTOM callcenter::*"]
      mappings:
        - from: "Cc-Action"
          to: "action"
          transforms: ["trim"]
        
        - from: "Cc-Agent"
          to: "agent_id"
          transforms: ["trim"]
        
        - from: "Cc-Queue"
          to: "queue_name"
          transforms: ["trim"]
        
        - from: "Cc-Agent-State"
          to: "agent_state"
          transforms: ["url_decode"]
        
        - from: "Cc-Agent-Status"
          to: "agent_status"
          transforms: ["url_decode"]
      field_filters:
        include_fields:
          - "timestamp" 
          - "action"         # Mapped fields only
          - "agent_id"
          - "queue_name"
          - "agent_state"
          - "agent_status"
        exclude_fields:
          - "headers"
          - "event_subclass"
          - "event_name"
        include_body: false
  field_filters:
    include_headers:
      - "Event-*"
      - "Unique-ID"
      - "Cc-*"
    exclude_headers:
      - "*-Ipv6"         # IPv6 addresses
      - "*-Switchname"   # Switch internal names
      - "*-Calling-*"    # Internal calling details
    # Không include body để tiết kiệm bandwidth
    include_body: false    

# HTTP destinations với selective routing
http:
  destinations:
    - name: "asm"
      url: "https://httpbin.org/post"
      method: "POST"
      headers:
        Content-Type: "application/json"
      timeout: 5s
      retry:
        max_attempts: 2
        backoff: "fixed"
        initial_delay: 2s
        max_delay: 5s
      event_filters:
        - "CUSTOM callcenter::*"

# Logging
logging:
  level: "debug"
  format: "console"
  output: "stdout"