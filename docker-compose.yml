services:
  fsevents:
    build:
      context: .
      dockerfile: Dockerfile
    image: luongdev/fsevents:0.1.0
    container_name: fsevents-sidecar
    restart: unless-stopped
    
    # Volumes for configuration and logs
    volumes:
      - ./configs:/app/configs:ro
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"