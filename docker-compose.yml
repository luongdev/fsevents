version: '3.8'

services:
  fsevents:
    build:
      context: .
      dockerfile: Dockerfile
    image: fsevents:latest
    container_name: fsevents-sidecar
    restart: unless-stopped
    
    # Environment variables
    environment:
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    
    # Volumes for configuration and logs
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    
    # Network configuration
    ports:
      - "9090:9090"  # Metrics port
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Add a simple webhook receiver for testing
  webhook-test:
    image: nginx:alpine
    container_name: webhook-receiver
    ports:
      - "8080:80"
    volumes:
      - ./test-webhook.conf:/etc/nginx/conf.d/default.conf:ro
    profiles:
      - testing 